<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostKey</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="brand">
          <img src="/ghostkey.svg" alt="" width="22" height="22" />
          <span>GhostKey</span>
          <span class="badge">alpha</span>
          <span class="spacer"></span>
          <button id="settings" class="row-btn" title="Settings">⚙</button>
        </div>
        <form id="quick-connect" autocomplete="off">
          <input id="quick-input" aria-label="Connection address" placeholder="Quick connect: user@host:port" spellcheck="false" />
          <button class="btn primary" type="submit">Connect</button>
        </form>
        <div class="sidebar-row">
          <input id="search" placeholder="Search sessions" spellcheck="false" />
          <button id="import-sessions" class="icon-btn" title="Import from PuTTY or SSH config">⇩</button>
          <button id="new-session" class="icon-btn" title="New session">+</button>
        </div>
        <nav id="session-list"></nav>
      </aside>
      <main id="main">
        <nav id="tabbar">
          <div id="tabs" role="tablist"></div>
          <button id="new-tab" class="tab-add" title="New tab (Ctrl+Shift+T)">+</button>
        </nav>
        <header id="toolbar">
          <span id="status-dot" class="dot"></span>
          <span id="conn-title">Not connected</span>
          <span id="conn-status"></span>
          <span id="log-indicator" class="rec" hidden>● REC</span>
          <span class="spacer"></span>
          <button id="reconnect" class="btn primary" hidden>Retry connection</button>
          <button id="disconnect" class="btn" hidden>Disconnect</button>
          <button id="log-toggle" class="btn" title="Log this session to a file (Ctrl+Shift+L)" hidden>Start log</button>
          <button id="terminal-find" class="btn" title="Find in terminal (Ctrl+Shift+F)">Find</button>
          <button id="split-right" class="icon-btn" title="Split right (Ctrl+Shift+R)">◫</button>
          <button id="split-down" class="icon-btn" title="Split down (Ctrl+Shift+D)">⬓</button>
        </header>
        <div id="workspace"></div>
      </main>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

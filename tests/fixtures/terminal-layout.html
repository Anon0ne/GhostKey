<!doctype html><html><body>
<div id="app"><aside id="sidebar"></aside><main id="main"><header id="toolbar">Toolbar</header><div id="workspace"><div class="tab-body"></div></div></main></div><div id="modal-root"></div>
<script type="module">
import '@xterm/xterm/css/xterm.css';
import '../../src/styles.css';
import '@fontsource/fira-code/400.css';
import { Pane } from '../../src/pane.ts';
await document.fonts.load('14px "Fira Code"');
const host={fontSize:()=>14,activate(){},changed(){},shortcut(){return false},close(){}};
const panes=[new Pane(host),new Pane(host)];
const tab=document.querySelector('.tab-body');
const split=document.createElement('div');split.className='split row';split.style.flex='1';
for(const pane of panes){pane.el.style.flex='1 1 0px';split.append(pane.el);}
tab.append(split);
window.layout={panes,split,fit(){panes.forEach(p=>p.fit());}};
await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
window.layout.fit();window.ready=true;
</script></body></html>
